---
configuration:
  log_level:
    name: Log level
    description: >-
      Controls the level of log details the add-on provides.
  address:
    name: Address
    description: >-
      Allows you to specify the IP address the AirCast server needs to
      bind to.
  latency_rtp:
    name: RTP Latency
    description: >-
      RTP audio buffer in milliseconds for AirPlay.
  latency_http:
    name: HTTP Latency
    description: >-
      HTTP audio buffer in milliseconds.
  drift:
    name: Drift
    description: >-
      Allow timing reference drift (no click).
  media_bridge_enabled:
    name: Enable media_player bridge
    description: >-
      Create an AirPlay receiver and call media_player.play_media when
      playback starts.
  media_player:
    name: Target media player
    description: >-
      Optional. Leave empty to auto-pick (prefers XiaoAI / Xiaomi speakers).
      Or set a media_player.* entity id, e.g. media_player.xiaoai_l05c.

  airplay_name:
    name: AirPlay name
    description: >-
      Name shown on iPhone/Mac AirPlay picker.
  media_content_type:
    name: media_content_type
    description: >-
      Value passed to media_player.play_media (usually "music").
  stream_format:
    name: Stream format
    description: >-
      HTTP stream format. Use mp3 for XiaoAI.
  restore_volume_on_disconnect:
    name: Restore volume after disconnect
    description: >-
      After AirPlay ends, set the speaker to the percentage below.
      iPhone volume keys still control the speaker during playback.
  restore_volume_percent:
    name: Restore volume percent
    description: Volume to apply after disconnect (0–100, default 20).
